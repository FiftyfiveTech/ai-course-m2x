[project]
name = "m2x"
version = "0.1.0"
description = "Turns a recorded meeting into a structured, cited, human-approved execution record"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

# `uv run m2x process <audio>` — the command the Phase 0 gate is run with.
[project.scripts]
m2x = "m2x.cli:main"

[dependency-groups]
corpus = [
    "datasets>=3.0",
    "soundfile>=0.12",
]
dev = [
    "pytest>=9.1.1",
]

# Declared so `uv sync` installs src/m2x into the venv. Without a build backend the
# src layout is not importable and every test fails at collection on a fresh clone.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m2x"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ on sys.path so shared fixtures import as `from conftest import ...`.
pythonpath = ["tests"]
addopts = "--strict-markers"
